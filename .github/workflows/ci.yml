name: CENTRUM MES — CI/CD Pipeline

on:
  push:
    branches: [ main, master, staging, develop ]
  pull_request:
    branches: [ main, master, staging, develop ]

# Default-deny GitHub token permissions. Jobs must request anything broader explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Test, Lint & Migration Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Database Migrations
        run: node scripts/validate-migrations.mjs

      - name: Reject Committed Secrets and Browser-side Credentials
        run: npm run security:secrets

      - name: Enforce RLS Migration Boundaries
        run: npm run security:rls

      - name: Enforce Read-Only Diagnostics
        run: npm run security:diagnostics

      - name: Enforce Client Data-Access Contract
        run: npm run security:access-contract

      - name: Audit Production Dependencies
        run: npm run security:audit

      - name: Lint Security-Critical Code
        run: npm run lint:security

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Build Application (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
