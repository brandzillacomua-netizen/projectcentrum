name: CENTRUM MES — CI/CD Pipeline

on:
  push:
    branches: [ main, master, staging, develop ]
  pull_request:
    branches: [ main, master, staging, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Test, Lint & Migration Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Database Migrations
        run: node scripts/validate-migrations.mjs

      - name: Reject Committed Secrets and Browser-side Credentials
        run: npm run security:secrets

      - name: Audit Production Dependencies
        run: npm run security:audit

      - name: Lint Security-Critical Code
        run: npm run lint:security

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Build Application (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
