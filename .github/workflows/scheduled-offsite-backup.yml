name: CENTRUM MES — Automated Offsite Encrypted Backup Cron

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offsite-backup:
    name: Encrypted Offsite Backup & Parity Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Production Encrypted Backup
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          AWS_S3_BUCKET: ${{ secrets.S3_BACKUP_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: node scripts/create-production-backup.mjs

      - name: Start Isolated Restore Container
        run: docker run -d --name centrum-restore-drill --label centrum.purpose=isolated-restore-drill -e POSTGRES_PASSWORD=postgres postgres:17.6-alpine

      - name: Wait for PostgreSQL
        run: sleep 10

      - name: Execute Restore Drill
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          AWS_S3_BUCKET: ${{ secrets.S3_BACKUP_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: node scripts/restore-production-backup-local.mjs

      - name: Verify Restore Parity Contract
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/verify-production-restore-parity.mjs
